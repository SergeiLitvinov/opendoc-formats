name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - name: Install office converter for real acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: >-
          sudo apt-get update && sudo apt-get install --no-install-recommends -y
          libreoffice-writer djvulibre-bin texlive-latex-base texlive-latex-recommended texlive-lang-cyrillic
      - run: uv run --frozen ruff check
      - run: uv run --frozen mypy
      - run: uv run --frozen python -m tools.audit
      - run: uv run --frozen pytest
      - run: uv run --frozen python -m tools.docs check
      - name: Validate own EPUB fixtures with pinned EPUBCheck
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          mkdir -p .opendoc-formats
          curl --fail --location --connect-timeout 15 --max-time 180 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip --output .opendoc-formats/epubcheck.zip
          uv run --frozen python -m tools.epubcheck --archive .opendoc-formats/epubcheck.zip
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: |
          mkdir -p .opendoc-formats
          uv export --frozen --all-extras --no-emit-project --no-hashes --output-file .opendoc-formats/profile-constraints.txt
      - run: uv build --out-dir .opendoc-formats/dist
      - name: Verify pinned Model public API without format engines
        run: |
          sdk_url=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['uv']['sources']['opendoc-model']['url'])")
          sdk_sha=$(python -c "import tomllib; p=next(p for p in tomllib.load(open('uv.lock', 'rb'))['package'] if p['name']=='opendoc-model'); print(p['wheels'][0]['hash'].removeprefix('sha256:'))")
          sdk_wheel=.opendoc-formats/opendoc_model-0.1.0-py3-none-any.whl
          curl --fail --location --connect-timeout 15 --max-time 180 "$sdk_url" --output "$sdk_wheel"
          uv venv .opendoc-formats/model-api
          uv pip install --python .opendoc-formats/model-api/bin/python "$sdk_wheel"
          .opendoc-formats/model-api/bin/python -I tools/model_api_consumer.py --wheel "$sdk_wheel" --sha256 "$sdk_sha" --output .opendoc-formats/model-api-evidence.json
      - run: uv run --frozen python -m tools.release check
      - run: uv run --frozen twine check .opendoc-formats/dist/*.whl .opendoc-formats/dist/*.tar.gz
      - name: Rebuild wheel from the source distribution
        run: uv build --wheel .opendoc-formats/dist/*.tar.gz --out-dir .opendoc-formats/from-sdist
      - name: Install base wheel outside the checkout
        run: |
          uv venv .opendoc-formats/installed
          uv pip install --python .opendoc-formats/installed/bin/python 'opendoc-model @ https://github.com/SergeiLitvinov/opendoc-model/releases/download/v0.1.0/opendoc_model-0.1.0-py3-none-any.whl' .opendoc-formats/from-sdist/*.whl
          .opendoc-formats/installed/bin/python -I tools/package_smoke.py
          .opendoc-formats/installed/bin/python -I tools/html_font_smoke.py
          .opendoc-formats/installed/bin/python -I tools/pdf_source_smoke.py
      - name: Exercise minimal PDF text extra
        run: |
          version=$(python -m tools.release version)
          uv pip install --python .opendoc-formats/installed/bin/python ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[pdf-text]"
          .opendoc-formats/installed/bin/python -I tools/package_smoke.py --pdf-text
      - name: Exercise native EPUB without EbookLib or lxml
        run: |
          version=$(python -m tools.release version)
          uv pip install --python .opendoc-formats/installed/bin/python ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[epub]"
          .opendoc-formats/installed/bin/python -I tools/package_smoke.py --epub
      - name: Install optional engines and exercise installed formats
        run: |
          version=$(python -m tools.release version)
          uv pip install --python .opendoc-formats/installed/bin/python ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[docx,html,pdf,pptx]"
          .opendoc-formats/installed/bin/python -I tools/package_smoke.py --all-formats
      - name: Exercise bounded font subset reuse without document engines
        run: |
          version=$(python -m tools.release version)
          uv venv .opendoc-formats/fonts-profile
          uv pip install --constraint .opendoc-formats/profile-constraints.txt --python .opendoc-formats/fonts-profile/bin/python 'opendoc-model @ https://github.com/SergeiLitvinov/opendoc-model/releases/download/v0.1.0/opendoc_model-0.1.0-py3-none-any.whl' ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[fonts]"
          .opendoc-formats/fonts-profile/bin/python -I tools/package_smoke.py --fonts
      - name: Exercise minimal HTML profile in a fresh environment
        run: |
          version=$(python -m tools.release version)
          uv venv .opendoc-formats/html-profile
          uv pip install --constraint .opendoc-formats/profile-constraints.txt --python .opendoc-formats/html-profile/bin/python 'opendoc-model @ https://github.com/SergeiLitvinov/opendoc-model/releases/download/v0.1.0/opendoc_model-0.1.0-py3-none-any.whl' ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[html]"
          .opendoc-formats/html-profile/bin/python -I tools/html_profile_smoke.py
      - name: Exercise native DOCX flow and owned fonts without fontTools or PDF engines
        run: |
          version=$(python -m tools.release version)
          uv venv .opendoc-formats/docx-flow-profile
          uv pip install --constraint .opendoc-formats/profile-constraints.txt --python .opendoc-formats/docx-flow-profile/bin/python 'opendoc-model @ https://github.com/SergeiLitvinov/opendoc-model/releases/download/v0.1.0/opendoc_model-0.1.0-py3-none-any.whl' ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[docx]"
          .opendoc-formats/docx-flow-profile/bin/python -I tools/docx_flow_smoke.py --minimal
          .opendoc-formats/docx-flow-profile/bin/python -I tools/docx_whitespace_smoke.py
          .opendoc-formats/docx-flow-profile/bin/python -I tools/docx_flow_smoke.py --minimal --fragmented
          .opendoc-formats/docx-flow-profile/bin/python -I tools/docx_flow_smoke.py --minimal --cell-borders
          .opendoc-formats/docx-flow-profile/bin/python -I tools/docx_flow_merge_smoke.py
          for crop in top bottom plain; do
            .opendoc-formats/docx-flow-profile/bin/python -I tools/docx_flow_merge_smoke.py --crop "$crop"
          done
      - name: Exercise native DOCX package editing without python-docx
        run: |
          version=$(python -m tools.release version)
          uv venv .opendoc-formats/docx-native-profile
          uv pip install --constraint .opendoc-formats/profile-constraints.txt --python .opendoc-formats/docx-native-profile/bin/python 'opendoc-model @ https://github.com/SergeiLitvinov/opendoc-model/releases/download/v0.1.0/opendoc_model-0.1.0-py3-none-any.whl' ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[docx-native]"
          .opendoc-formats/docx-native-profile/bin/python -I tools/docx_native_smoke.py
      - name: Exercise PPTX source package without other document engines
        run: |
          version=$(python -m tools.release version)
          uv venv .opendoc-formats/pptx-profile
          uv pip install --constraint .opendoc-formats/profile-constraints.txt --python .opendoc-formats/pptx-profile/bin/python 'opendoc-model @ https://github.com/SergeiLitvinov/opendoc-model/releases/download/v0.1.0/opendoc_model-0.1.0-py3-none-any.whl' ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[pptx]"
          .opendoc-formats/pptx-profile/bin/python -I tools/pptx_package_smoke.py
      - name: Exercise PDF profiles and owned TTF/OTF resources without fontTools
        run: |
          version=$(python -m tools.release version)
          for profile in pdf pdf-rich pdf-layout pdf-docx; do
            uv venv ".opendoc-formats/${profile}"
            uv pip install --constraint .opendoc-formats/profile-constraints.txt --python ".opendoc-formats/${profile}/bin/python" 'opendoc-model @ https://github.com/SergeiLitvinov/opendoc-model/releases/download/v0.1.0/opendoc_model-0.1.0-py3-none-any.whl' ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[${profile}]"
            ".opendoc-formats/${profile}/bin/python" -I tools/pdf_profile_smoke.py "${profile}"
            if [ "${profile}" = pdf ]; then
              ".opendoc-formats/${profile}/bin/python" -I tools/pdf_ligature_smoke.py
              ".opendoc-formats/${profile}/bin/python" -I tools/pdf_cell_image_smoke.py
            fi
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-packages
          path: |
            .opendoc-formats/dist/*.whl
            .opendoc-formats/dist/*.tar.gz
            .opendoc-formats/dist/SHA256SUMS
          if-no-files-found: error
