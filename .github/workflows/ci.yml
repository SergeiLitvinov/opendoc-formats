name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check
      - run: uv run --frozen mypy
      - run: uv run --frozen python -m tools.audit
      - run: uv run --frozen pytest
      - run: uv run --frozen python -m tools.docs check
  packages:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - run: uv build --out-dir .opendoc-formats/dist
      - run: uv run --frozen python -m tools.release check
      - run: uv run --frozen twine check .opendoc-formats/dist/*.whl .opendoc-formats/dist/*.tar.gz
      - name: Rebuild wheel from the source distribution
        run: uv build --wheel .opendoc-formats/dist/*.tar.gz --out-dir .opendoc-formats/from-sdist
      - name: Install base wheel outside the checkout
        run: |
          uv venv .opendoc-formats/installed
          uv pip install --python .opendoc-formats/installed/bin/python 'opendoc @ https://github.com/SergeiLitvinov/opendoc/releases/download/v0.1.0/opendoc-0.1.0-py3-none-any.whl' .opendoc-formats/from-sdist/*.whl
          .opendoc-formats/installed/bin/python -I tools/package_smoke.py
      - name: Install optional engines and exercise installed formats
        run: |
          version=$(python -m tools.release version)
          uv pip install --python .opendoc-formats/installed/bin/python ".opendoc-formats/from-sdist/opendoc_formats-${version}-py3-none-any.whl[docx,html,pdf,pptx]"
          .opendoc-formats/installed/bin/python -I tools/package_smoke.py --all-formats
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-packages
          path: |
            .opendoc-formats/dist/*.whl
            .opendoc-formats/dist/*.tar.gz
            .opendoc-formats/dist/SHA256SUMS
          if-no-files-found: error
