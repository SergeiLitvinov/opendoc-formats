name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-packages
          path: .opendoc-formats/dist
      - run: python -m tools.release check --tag "$GITHUB_REF_NAME"
      - name: Create release and upload distributions
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const changelog = fs.readFileSync('docs/development/changelog.md', 'utf8');
            const section = changelog.split(/^## /m).find(s => s.startsWith(tag.slice(1) + ' — '));
            if (!section) throw new Error('Missing release notes for tag');
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `OpenDoc Formats ${tag}`,
              body: section.substring(section.indexOf('\n') + 1).trim(), draft: true
            });
            const directory = '.opendoc-formats/dist';
            for (const name of fs.readdirSync(directory).sort()) {
              if (!name.endsWith('.whl') && !name.endsWith('.tar.gz') && name !== 'SHA256SUMS') continue;
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(path.join(directory, name))
              });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false });
