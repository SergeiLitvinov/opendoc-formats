name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: .opendoc-formats/dist
      - run: python -m tools.release check --tag "$GITHUB_REF_NAME"
      - name: Create release and upload distributions
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const section = changelog.split(/^## /m).find(s => s.startsWith(tag.slice(1) + ' — '));
            if (!section) throw new Error('Missing release notes for tag');
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `OpenDoc Formats ${tag}`,
              body: section.substring(section.indexOf('\n') + 1).trim(), draft: true
            });
            const directory = '.opendoc-formats/dist';
            for (const name of fs.readdirSync(directory).sort()) {
              if (!name.endsWith('.whl') && !name.endsWith('.tar.gz') && name !== 'SHA256SUMS') continue;
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(path.join(directory, name))
              });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false });
